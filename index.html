<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanji Cards</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#b8452f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- HOME VIEW: list of groups -->
  <section id="view-home" class="view">
    <header class="topbar">
      <h1>Kanji Cards</h1>
    </header>
    <div id="group-list" class="group-list"></div>
  </section>

  <!-- LEARN VIEW: flashcard session -->
  <section id="view-learn" class="view" hidden>
    <header class="topbar">
      <button class="btn btn-back" id="btn-learn-back">&larr; Back</button>
      <span id="learn-progress" class="learn-progress"></span>
      <button class="btn btn-back" id="btn-restart-shuffle">&#8635; Reshuffle</button>
    </header>

    <div id="card-area" class="card-area">
      <div id="flashcard" class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <span id="card-char" class="card-char"></span>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="card-meaning" id="card-meaning"></div>
            <div class="card-readings" id="card-readings"></div>
            <div class="card-notes" id="card-notes"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="learn-controls">
      <button id="btn-prev" class="btn btn-nav">&larr; Prev</button>
      <button id="btn-flip" class="btn btn-nav btn-primary">Flip</button>
      <button id="btn-next" class="btn btn-nav">Next &rarr;</button>
    </div>

    <p id="learn-done" class="empty-state" hidden>You've gone through the whole group! Reshuffle to go again.</p>
  </section>

</div>
<script src="app.js"></script>
</body>
</html>
